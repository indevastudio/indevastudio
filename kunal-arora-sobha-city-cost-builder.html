<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunal Arora — Sobha City — Cost Builder | Indéva Studio</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* "Claude" palette — warm ink, clay/coral accent, soft cream surfaces */
    --espresso:#262019;
    --espresso-soft:#44403A;
    --brass:#D97757;
    --brass-dark:#BF5A3B;
    --cream:#F5F4EE;
    --cream-dk:#EEE9DC;
    --card:#FFFEFB;
    --line:#E5E1D5;
    --grey:#83807A;
    --good:#6B8F71;
    --radius:12px;
    --shadow:0 1px 3px rgba(38,32,25,.06), 0 6px 18px rgba(38,32,25,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--espresso);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', Georgia, serif; font-optical-sizing:auto; }

  header.top{
    background:var(--espresso);
    color:var(--cream);
    padding:22px 24px 20px;
    box-shadow:0 2px 10px rgba(38,32,25,.12);
  }
  header.top .brandline{
    font-size:11px; letter-spacing:2px; color:var(--brass); font-weight:600;
    margin-bottom:6px;
  }
  header.top h1{
    font-size:28px; font-weight:600; margin:0 0 4px; color:#fff; line-height:1.15;
  }
  header.top p{
    margin:0; color:#cfc6b8; font-size:13.5px;
  }

  nav.tabs{
    position:sticky; top:0; z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    background:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600; color:var(--grey);
    padding:14px 16px 12px;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--espresso);
    border-bottom-color:var(--brass);
  }

  main{ max-width:960px; margin:0 auto; padding:20px 16px 100px; }

  section.panel{ display:none; }
  section.panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .showall-bar{
    background:var(--cream); border-bottom:1px solid var(--line);
    display:flex; justify-content:center; padding:8px 12px;
  }
  .showall-btn{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    background:none; border:1.5px solid var(--brass-dark); color:var(--brass-dark);
    padding:7px 16px; border-radius:20px; cursor:pointer; letter-spacing:.2px;
  }
  .showall-btn.active{ background:var(--espresso); color:#fff; border-color:var(--espresso); }

  section.panel.active ~ section.panel.active{
    margin-top:36px; padding-top:32px; border-top:2px solid var(--line);
  }

  .panel-head{ margin-bottom:16px; }
  .panel-head h2{ font-size:23px; margin:0 0 4px; font-weight:600; }
  .panel-head p{ margin:0; color:var(--grey); font-size:13.5px; max-width:68ch; }

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .item-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:6px;
  }
  .item-title{ font-weight:600; font-size:14.5px; }
  .item-room{ font-size:11.5px; color:var(--brass-dark); font-weight:600; }
  .item-spec{ font-size:12.5px; color:var(--grey); margin:4px 0 8px; line-height:1.45; }

  .toggle-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; width:38px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0;
    background:#d8cfbe; border-radius:22px; transition:.15s;
  }
  .slider:before{
    content:""; position:absolute; height:16px; width:16px; left:3px; top:3px;
    background:white; border-radius:50%; transition:.15s;
  }
  input:checked + .slider{ background:var(--brass); }
  input:checked + .slider:before{ transform:translateX(16px); }

  .amount{ font-weight:700; font-size:15px; white-space:nowrap; }
  .amount.off{ color:#b9b0a2; text-decoration:line-through; }

  .options{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .opt{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:8px 12px;
    cursor:pointer;
    min-width:118px;
    background:#fff;
    transition:border-color .12s, background .12s;
  }
  .opt.selected{ border-color:var(--brass-dark); background:var(--cream-dk); }
  .opt input{ display:none; }
  .opt .brand{ font-weight:700; font-size:13px; display:block; }
  .opt .rate{ font-size:12.5px; color:var(--espresso-soft); margin-top:2px; }

  .tier-options{ flex-direction:column; }
  .opt.tier-opt{ width:100%; min-width:0; display:flex; flex-direction:column; gap:2px; padding:10px 12px; }
  .opt.tier-opt .brand{ font-size:13px; }
  .tier-desc{ font-size:12px; color:var(--grey); line-height:1.4; }

  .divider-note{
    font-size:11.5px; color:var(--grey); font-style:italic; margin:10px 2px 16px;
    padding-left:10px; border-left:2px solid var(--line);
  }

  .subtotal-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--espresso); color:#fff;
    padding:12px 16px; border-radius:var(--radius); margin-top:6px;
    font-weight:600; font-size:14px;
  }
  .subtotal-strip .val{ color:var(--brass); font-size:17px; }

  .cs-group{ margin-bottom:18px; }
  .cs-group h3{ font-size:16px; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  table.cs{ width:100%; border-collapse:collapse; font-size:13px; }
  table.cs th{
    text-align:left; font-size:10.5px; letter-spacing:.5px; color:var(--grey);
    padding:4px 8px; border-bottom:1px solid var(--line); font-weight:600;
  }
  table.cs td{ padding:7px 8px; border-bottom:1px solid #f0ebe0; vertical-align:top; }
  table.cs td.num, table.cs th.num{ text-align:right; white-space:nowrap; }
  table.cs tr.excluded td{ color:#b9b0a2; text-decoration:line-through; }

  .grand{
    background:var(--espresso); color:#fff; border-radius:var(--radius);
    padding:18px 20px; margin-top:20px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 8px 24px rgba(38,32,25,.18);
  }
  .grand .label{ font-size:14px; color:#cfc6b8; }
  .grand .value{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:#fff; }
  .grand .value.under{ color:#8fc38f; }
  .grand .value .brass{ color:var(--brass); }
  .cap-note{ font-size:12.5px; margin-top:6px; color:#cfc6b8; }

  button.cta{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    background:var(--brass); color:#fff; border:none;
    padding:11px 18px; border-radius:var(--radius); cursor:pointer;
    box-shadow:0 2px 8px rgba(217,119,87,.35);
  }
  button.cta.ghost{ background:transparent; border:1.5px solid var(--espresso); color:var(--espresso); }
  .actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }

  .foot-note{ font-size:11.5px; color:var(--grey); margin-top:22px; line-height:1.5; }

  .sticky-total{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--espresso); color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.18);
  }
  .sticky-total .l{ font-size:12px; color:#cfc6b8; }
  .sticky-total .v{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--brass); }
  .sticky-total button{
    background:var(--brass); color:var(--espresso); border:none; font-weight:700;
    font-size:12.5px; padding:9px 14px; border-radius:var(--radius); cursor:pointer;
  }

  @media (min-width: 760px){
    .sticky-total{ display:none; }
    main{ padding-bottom:60px; }
  }
  @media (max-width: 759px){
    header.top{ padding:16px 16px 14px; }
    header.top h1{ font-size:20px; line-height:1.2; }
    header.top p{ font-size:12px; line-height:1.4; }
    nav.tabs button{ font-size:12.5px; padding:11px 12px 10px; }
    main{ padding:14px 12px 84px; }
    .item{ padding:11px 12px; }
    .item-top{ flex-wrap:wrap; row-gap:8px; }
    .grand{ padding:15px 16px; flex-wrap:wrap; gap:6px; }
    .grand .value{ font-size:22px; }
    .actions{ flex-direction:column; }
    .actions button{ width:100%; text-align:center; }
  }

  @media print{
    nav.tabs, .showall-bar, .sticky-total, .actions, .toggle-row .switch, header.top .brandline{ display:none !important; }
    section.panel{ display:block !important; }
    section.panel:not(#panel-costsheet){ display:none !important; }
    body{ background:#fff; }
  }

  /* ---------- Reference image gallery / hero / lightbox ---------- */
  .floorplan-wrap{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; text-align:center; margin-bottom:18px;
  }
  .floorplan-wrap img{ max-width:100%; height:auto; border-radius:2px; cursor:pointer; }
  .floorplan-wrap .cap{ margin-top:8px; font-size:12.5px; color:var(--grey); }
  .gallery{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;
  }
  .gallery-item{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    cursor:pointer;
  }
  .gallery-item img{ width:100%; height:110px; object-fit:cover; display:block; }
  .gallery-item .cap{ padding:6px 8px; font-size:11px; color:var(--espresso-soft); font-weight:600; line-height:1.3; }

  .tab-hero{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px;
    margin-bottom:16px;
  }
  .tab-hero .th-item{
    position:relative; border-radius:var(--radius); overflow:hidden; height:130px; background:var(--cream-dk);
  }
  .tab-hero .th-item img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .tab-hero .th-item .cap{
    position:absolute; left:0; right:0; bottom:0; padding:6px 8px;
    background:linear-gradient(transparent, rgba(0,0,0,.55));
    color:#fff; font-size:11px; font-weight:600;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(20,16,12,.92); z-index:200;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:82vh; border-radius:3px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox .lb-cap{ position:absolute; bottom:28px; left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  .lightbox .lb-close{
    position:absolute; top:18px; right:22px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer;
    line-height:1;
  }
  @media (max-width: 759px){
    .tab-hero .th-item{ height:100px; }
    .gallery{ grid-template-columns:repeat(2, 1fr); }
    .gallery-item img{ height:96px; }
  }
  @media print{
    .lightbox{ display:none !important; }
  }

  .spec-box{ font-size:12.5px; color:var(--espresso-soft); background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:9px 12px; line-height:1.5; }
  .src{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.2px; padding:2px 8px; border-radius:10px; background:#E3EDD9; color:#3F6B46; vertical-align:2px; margin-left:4px; }
  .src.disc{ background:#E6E0F5; color:#4B3F8A; }
  .src.warn{ background:#FBEBDD; color:#A2542F; }
  .cfg-wrap{ overflow-x:auto; margin-bottom:14px; }
  table.cfg{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); }
  table.cfg th{ text-align:left; font-size:10.5px; letter-spacing:.5px; color:var(--grey); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.cfg td{ padding:7px 10px; border-bottom:1px solid #f0ebe0; vertical-align:top; }
  .csd{ font-size:11.5px; color:var(--grey); line-height:1.4; }
  table.cs td:nth-child(2){ max-width:360px; }
</style>
</head>

<header class="top">
  <div class="brandline">INDÉVA STUDIO · INTERACTIVE COST BUILDER</div>
  <h1>Kunal Arora — 4 BHK Residence, Sobha City</h1>
  <p>Revision 1 — detailed scope of work with Indéva master BOQ rates, materials and brands. Tap a category, pick your options, and your cost sheet builds itself.</p>
</header>

<nav class="tabs" id="tabs"></nav>

</div>

</div>
<main id="main"></main>

<div class="sticky-total" id="stickyTotal">

    <div class="v" id="stickyValue">₹0</div>
  </div>
  <button onclick="goTo('costsheet')">View cost sheet</button>
</div>

      {id:"shower", room:"Bathrooms 01–04", name:"Glass shower partition", unit:"No.", qty:4, rate:16500, on:true, src:"Market rate · to confirm",
       spec:"10mm toughened clear glass partition with SS 304 hinges / clamps and seals, approx. 15 sq.ft. per bathroom at about ₹1,100/sq.ft. Size per bathroom to be measured."},
    ]},
  ]
},
{
  id:"balconies", tab:"Balconies", letter:"G", title:"Balconies — Living / Bedroom 02 (28'2\" long) and Bedroom 01",
  intro:"Two balconies: the extended balcony along the living room and Bedroom 02, and Bedroom 01's balcony. Outdoor furniture and planters only — no civil work on the façade.",
  hero:[],
  groups:[
    {note:null, items:[
      {id:"balbig", room:"Living balcony", name:"Outdoor lounge set + planters", unit:"set", qty:1, rate:40000, on:true, src:"Allowance",
       spec:"Outdoor lounge set (2-seater + 2 chairs + coffee table), weatherproof, with planters."},
      {id:"balmaster", room:"Bedroom 01 balcony", name:"Bistro set", unit:"set", qty:1, rate:25000, on:true, src:"Allowance",
       spec:"Outdoor bistro set (2 chairs + table), weatherproof."},
      {id:"deck", room:"Living balcony", name:"Artificial grass / deck tiles", unit:"sq.ft.", qty:115, rate:220, on:false, src:"Optional · market rate",
       spec:"Interlocking WPC deck tiles or artificial grass laid loose over the builder's flooring, approx. 28 ft × 4 ft."},
    ]},
  ]
},
{
  id:"design", tab:null, letter:"H", title:"Design & Execution", intro:"", hero:[],
  groups:[{note:null, items:[
    {id:"designexec", room:"Whole Apartment", name:"Design Consultancy & Site Execution Management", unit:"sq.ft.", qty:1581, rate:100, on:true, src:"To confirm",
     spec:"Design development, 3D views, working drawings, BOQ and on-site supervision through to handover, at ₹100/sq.ft. of carpet area (Indéva design rate)."},
  ]}]
},
];

const KITCHEN_CONFIG = [];


/* =====================================================================
   STATE
   ===================================================================== */
const ALL_ITEMS = [];
SECTIONS.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>{ it._sec=s; ALL_ITEMS.push(it); })));
const BY_ID = Object.fromEntries(ALL_ITEMS.map(i=>[i.id,i]));
const DEFAULTS = Object.fromEntries(ALL_ITEMS.map(i=>[i.id,{on:i.on, selected:i.selected}]));

function rateOf(it){ return it.options ? it.options[it.selected].rate : it.rate; }
function amtOf(it){ return it.qty * rateOf(it); }
function specOf(it){ return it.options ? it.options[it.selected].spec : it.spec; }
function secTotal(s){ let t=0; s.groups.forEach(g=>g.items.forEach(it=>{ if(it.on) t+=amtOf(it); })); return t; }
function grandTotal(){ return SECTIONS.reduce((t,s)=>t+secTotal(s),0); }

const STORAGE_KEY = 'kunalAroraSobhaCostBuilder_v2';
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.fromEntries(ALL_ITEMS.map(i=>[i.id,{on:i.on,selected:i.selected}])))); }catch(e){}
}
function loadState(){
  let raw=null; try{ raw=localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
  if(!raw) return;
  try{
    const s=JSON.parse(raw);
    Object.entries(s).forEach(([id,v])=>{ const it=BY_ID[id]; if(!it||!v) return;
      it.on=!!v.on; if(it.options && v.selected && it.options[v.selected]) it.selected=v.selected; });
  }catch(e){}
}
function resetAll(){
  ALL_ITEMS.forEach(i=>{ i.on=DEFAULTS[i.id].on; i.selected=DEFAULTS[i.id].selected; });
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderMain();
}
function setOpt(id, name){ BY_ID[id].selected=name; saveState(); renderMain(); }
function toggleItem(id, val){ BY_ID[id].on=val; saveState(); renderMain(); }

/* =====================================================================
   RENDER
   ===================================================================== */
const TABS = [{id:"overview", label:"Overview"}]
  .concat(SECTIONS.filter(s=>s.tab).map(s=>({id:s.id, label:s.tab})))
  .concat([{id:"costsheet", label:"Cost Sheet"}]);

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>`<button data-tab="${t.id}" onclick="goTo('${t.id}')">${t.label}</button>`).join('');
}
function hero(keys){
  if(!keys||!keys.length) return '';
  return `<div class="tab-hero">${keys.map(k=>REF_IMAGES[k]?`<div class="th-item" onclick="openLightbox('${k}')"><img src="${REF_IMAGES[k].src}" alt=""><div class="cap">${REF_IMAGES[k].cap}</div></div>`:'').join('')}</div>`;
}
function renderItem(it){
  const amt=amtOf(it);
  const opts = it.options ? `<div class="options tier-options">${Object.keys(it.options).map(n=>{
      const o=it.options[n], sel=n===it.selected;
      return `<label class="opt tier-opt ${sel?'selected':''}">
        <input type="radio" name="${it.id}" ${sel?'checked':''} onchange="setOpt('${it.id}','${n}')">
        <span class="brand">${n} — ${fmt(o.rate)}${it.unit==='sq.ft.'?' /sq.ft.':''}</span>
        <span class="tier-desc">${o.spec}</span></label>`;}).join('')}</div>`
    : `<div class="spec-box">${it.spec}</div>`;
  const badge = it.src ? `<span class="src ${it.discount?'disc':(/confirm|Allowance/.test(it.src)?'warn':'')}">${it.src}</span>` : '';
  return `<div class="item">
    <div class="item-top">
      <div><div class="item-room">${it.room}</div><div class="item-title">${it.name} ${badge}</div></div>
      <div class="toggle-row"><span class="amount ${it.on?'':'off'}">${fmt(amt)}</span>
        <label class="switch"><input type="checkbox" ${it.on?'checked':''} onchange="toggleItem('${it.id}',this.checked)"><span class="slider"></span></label></div>
    </div>
    <div class="item-spec">${num(it.qty)+' '+it.unit+' × '+fmt(rateOf(it))}${it.options?` — <b>${it.selected}</b>`:''}</div>
    ${opts}
  </div>`;
}
function renderSection(s){
  const cfg = s.config ? `<div class="divider-note">Proposed kitchen configuration</div>
    <div class="cfg-wrap"><table class="cfg"><thead><tr><th>Zone</th><th>Unit</th><th>Size</th><th>Included fittings</th></tr></thead><tbody>
    ${KITCHEN_CONFIG.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>` : '';
  return `<section class="panel" id="panel-${s.id}">
    <div class="panel-head"><h2>${s.title}</h2><p>${s.intro}</p></div>
    ${hero(s.hero)}${cfg}
    ${s.groups.map(g=>(g.note?`<div class="divider-note">${g.note}</div>`:'')+g.items.map(renderItem).join('')).join('')}
    <div class="subtotal-strip"><span>Section subtotal</span><span class="val">${fmt(secTotal(s))}</span></div>
  </section>`;
}
function panelOverview(){
  return `<section class="panel" id="panel-overview">
    <div class="panel-head"><h2>Project Overview</h2>
      <p>Mr. Kunal Arora · Sobha City · Type F8, 4 bedroom residence with flexi space. A complete interior fit-out of a new apartment: the builder's flooring, bathroom tiles, sanitaryware, doors and windows stay as they are. Every line states the actual material, board, finish and hardware brand. <b>Standard</b> is the value specification and <b>Premium</b> the higher one; the kitchen and vanities are priced by finish (Laminate / Acrylic / PU). Switch any item off to see the effect on the total.</p></div>
    <div class="floorplan-wrap"><img src="${REF_IMAGES.floorplan.src}" onclick="openLightbox('floorplan')" alt="Floor plan"><div class="cap">${REF_IMAGES.floorplan.cap}</div></div>
    <div class="item"><div class="item-title">Room schedule (from the plan)</div><div class="item-spec" style="margin-bottom:0">
      <b>Living / Dining</b> 4600 × 7500 (15'1" × 24'7") · <b>Bar / flexi</b> 1700 × 2600 · <b>Foyer</b> 1500 × 2500 · <b>Kitchen</b> 3400 × 2700 · <b>Utility</b> 1850 × 1500 · <b>Bedroom 01</b> 3450 × 5000 + <b>Dress</b> 2700 × 1650 · <b>Bedrooms 02 & 03</b> 3400 × 4000 · <b>Bedroom 04</b> 3000 × 3250 · <b>4 bathrooms</b> · <b>2 balconies</b>. Carpet area 1,581 sq.ft.</div></div>
    <div class="item"><div class="item-title">Scope covered</div><div class="item-spec" style="margin-bottom:0">
      <b>Entire house:</b> gypsum false ceiling, electrical modifications, Philips cove and spot lighting, Royale-grade paint, blackout + sheer curtains.<br>
      <b>Living, dining & bar:</b> TV + storage unit, sofa for 6, coffee table, feature wall, chandelier, 8-seater dining, crockery unit, bar unit with stone top, foyer shoe cabinet and feature wall.<br>
      <b>Kitchen & utility:</b> L-shaped modular kitchen with tall pantry, Hettich / Ebco hardware, stone counter, sink, under-cabinet LED, plumbing fit-out; utility unit and ceiling cloth dryer.<br>
      <b>Bedroom 01:</b> L-shaped walk-in wardrobe in the dress area, dresser, king bed, bedside tables, TV unit, bed-back wall, work desk.<br>
      <b>Bedrooms 02–04:</b> wardrobe, queen bed, bedside tables, TV unit and bed-back wall in each.<br>
      <b>Bathrooms:</b> vanity units, mirrors and glass shower partitions in all four.<br>
      <b>Balconies:</b> outdoor lounge and bistro sets.<br>
      <b>Not included:</b> civil and demolition work, flooring and bathroom tiling (builder-finished), appliances, chimney and hob, mattresses, ACs, switch plates, MCBs and decorative fixtures other than those listed.</div></div>
    <div class="item"><div class="item-title">Material standards used throughout</div><div class="item-spec" style="margin-bottom:0">
      <b>Boards:</b> HDHMR (Action TESA / Greenpanel) for dry-area carcasses; 18mm BWP ply (Century / Greenply) for wet areas.<br>
      <b>Surfaces:</b> 1mm laminate (Merino / Greenlam), 1.2mm acrylic (Rehau / Merino Luxe), 2K PU paint (ICA / Sirca); 2mm PVC edge banding (Rehau).<br>
      <b>Hardware:</b> Hettich / Ebco (Ozone on Standard woodwork).<br>
      <b>Civil:</b> Saint-Gobain Gyproc ceilings, Asian Paints Royale / Dulux / Berger Silk. <b>Lighting:</b> Philips.</div></div>
  </section>`;
}
function panelCostSheet(){
  let rows='';
  SECTIONS.forEach(s=>{
    rows += `<div class="cs-group"><h3>${s.letter}. ${s.title}</h3><table class="cs"><thead><tr><th>Item</th><th>Specification</th><th class="num">Amount</th></tr></thead><tbody>
      ${s.groups.map(g=>g.items.map(it=>`<tr class="${it.on?'':'excluded'}"><td><b>${it.room}</b> — ${it.name}<br><span class="csd">${num(it.qty)+' '+it.unit+' × '+fmt(rateOf(it))}${it.options?' · '+it.selected:''}</span></td><td class="csd">${specOf(it)}</td><td class="num">${fmt(amtOf(it))}</td></tr>`).join('')).join('')}
      <tr><td colspan="2" style="text-align:right;font-weight:600">Subtotal</td><td class="num" style="font-weight:700">${fmt(secTotal(s))}</td></tr></tbody></table></div>`;
  });
  return `<section class="panel" id="panel-costsheet">
    <div class="panel-head"><h2>Cost Sheet</h2><p>Built from your current selections. Switched-off items are struck through and not counted.</p></div>
    ${rows}
    <div class="grand"><div><div class="label">Grand Total (excl. GST)</div><div class="cap-note">Mr. Kunal Arora · Sobha City · Type F8 · Revision 1</div></div><div class="value">${fmt(grandTotal())}</div></div>
    <div class="actions"><button class="cta" onclick="window.print()">Print / Save as PDF</button><button class="cta ghost" onclick="resetAll()">Reset to recommended</button></div>
    <p class="foot-note">Excludes GST, transportation, civil and demolition work, flooring and bathroom tiling (builder-finished), appliances, chimney and hob, mattresses, ACs, switch plates, MCBs, DB and light fixtures other than the Philips lighting and chandelier listed. Ceiling, electrical, paint, plumbing, stone and woodwork rates follow the Indéva master BOQ (labour + material). Quantities are measured from the builder’s plan and will be confirmed on site measurement. Items marked "Allowance" are budget figures that change with your selection; items marked "to confirm" are dealer or market rates, or quantities to be fixed on site; items marked "Optional" or "Switch on if needed" are off by default and not in the total.</p>
  </section>`;
}
let currentTab='overview', showAllMode=false;
function renderMain(){
  const y=window.scrollY;
  document.getElementById('main').innerHTML = panelOverview() + SECTIONS.filter(s=>s.tab).map(renderSection).join('') + renderSection(SECTIONS.find(s=>s.id==='design')).replace('class="panel"','class="panel" data-hidden="1"') + panelCostSheet();
  document.getElementById('stickyValue').textContent = fmt(grandTotal());
  applyView(false); window.scrollTo(0,y);
}
function applyView(scrollTop){
  document.querySelectorAll('section.panel').forEach(p=>{
    const id=p.id.replace('panel-','');
    const show = p.dataset.hidden ? false : (showAllMode ? true : id===currentTab);
    p.classList.toggle('active', show);
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', !showAllMode && b.dataset.tab===currentTab));
  const btn=document.getElementById('showAllBtn'); btn.classList.toggle('active', showAllMode);
  btn.textContent = showAllMode ? '✕ Back to Tabs' : '☰ Show All Categories';
  if(scrollTop) window.scrollTo({top:0, behavior:'auto'});
}
function goTo(id){ showAllMode=false; currentTab=id; applyView(true); }
function toggleShowAll(){ showAllMode=!showAllMode; applyView(true); }
function openLightbox(key){ const img=REF_IMAGES[key]; if(!img) return;
  document.getElementById('lightboxImg').src=img.src; document.getElementById('lightboxCap').innerHTML=img.cap;
  document.getElementById('lightbox').classList.add('open'); }
function closeLightbox(e){ if(e) e.stopPropagation(); document.getElementById('lightbox').classList.remove('open'); }

loadState(); renderTabs(); renderMain(); goTo('overview');

</script>
</body>
</html>
