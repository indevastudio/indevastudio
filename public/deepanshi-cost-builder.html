<html lang="en">
<head>
<meta charset="UTF-8">

<title>Deepanshi — 3 BHK Residence — Cost Builder | Indéva Studio</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* "Claude" palette — warm ink, clay/coral accent, soft cream surfaces */
    --espresso:#262019;
    --espresso-soft:#44403A;
    --brass:#D97757;
    --brass-dark:#BF5A3B;
    --cream:#F5F4EE;
    --cream-dk:#EEE9DC;
    --card:#FFFEFB;
    --line:#E5E1D5;
    --grey:#83807A;
    --good:#6B8F71;
    --radius:12px;
    --shadow:0 1px 3px rgba(38,32,25,.06), 0 6px 18px rgba(38,32,25,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--espresso);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', Georgia, serif; font-optical-sizing:auto; }

  header.top{
    background:var(--espresso);
    color:var(--cream);
    padding:22px 24px 20px;
    box-shadow:0 2px 10px rgba(38,32,25,.12);
  }
  header.top .brandline{
    font-size:11px; letter-spacing:2px; color:var(--brass); font-weight:600;
    margin-bottom:6px;
  }
  header.top h1{
    font-size:28px; font-weight:600; margin:0 0 4px; color:#fff; line-height:1.15;
  }
  header.top p{
    margin:0; color:#cfc6b8; font-size:13.5px;
  }

  nav.tabs{
    position:sticky; top:0; z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    background:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600; color:var(--grey);
    padding:14px 16px 12px;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--espresso);
    border-bottom-color:var(--brass);
  }

  main{ max-width:960px; margin:0 auto; padding:20px 16px 100px; }

  section.panel{ display:none; }
  section.panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .showall-bar{
    background:var(--cream); border-bottom:1px solid var(--line);
    display:flex; justify-content:center; padding:8px 12px;
  }
  .showall-btn{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    background:none; border:1.5px solid var(--brass-dark); color:var(--brass-dark);
    padding:7px 16px; border-radius:20px; cursor:pointer; letter-spacing:.2px;
  }
  .showall-btn.active{ background:var(--espresso); color:#fff; border-color:var(--espresso); }

  section.panel.active ~ section.panel.active{
    margin-top:36px; padding-top:32px; border-top:2px solid var(--line);
  }

  .panel-head{ margin-bottom:16px; }
  .panel-head h2{ font-size:23px; margin:0 0 4px; font-weight:600; }
  .panel-head p{ margin:0; color:var(--grey); font-size:13.5px; max-width:68ch; }

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .item-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:6px;
  }
  .item-title{ font-weight:600; font-size:14.5px; }
  .item-room{ font-size:11.5px; color:var(--brass-dark); font-weight:600; }
  .item-spec{ font-size:12.5px; color:var(--grey); margin:4px 0 8px; line-height:1.45; }

  .toggle-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; width:38px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0;
    background:#d8cfbe; border-radius:22px; transition:.15s;
  }
  .slider:before{
    content:""; position:absolute; height:16px; width:16px; left:3px; top:3px;
    background:white; border-radius:50%; transition:.15s;
  }
  input:checked + .slider{ background:var(--brass); }
  input:checked + .slider:before{ transform:translateX(16px); }

  .amount{ font-weight:700; font-size:15px; white-space:nowrap; }
  .amount.off{ color:#b9b0a2; text-decoration:line-through; }

  .options{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .opt{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:8px 12px;
    cursor:pointer;
    min-width:118px;
    background:#fff;
    transition:border-color .12s, background .12s;
  }
  .opt.selected{ border-color:var(--brass-dark); background:var(--cream-dk); }
  .opt input{ display:none; }
  .opt .brand{ font-weight:700; font-size:13px; display:block; }
  .opt .rate{ font-size:12.5px; color:var(--espresso-soft); margin-top:2px; }

  .tier-options{ flex-direction:column; }
  .opt.tier-opt{ width:100%; min-width:0; display:flex; flex-direction:column; gap:2px; padding:10px 12px; }
  .opt.tier-opt .brand{ font-size:13px; }
  .tier-desc{ font-size:12px; color:var(--grey); line-height:1.4; }

  .divider-note{
    font-size:11.5px; color:var(--grey); font-style:italic; margin:10px 2px 16px;
    padding-left:10px; border-left:2px solid var(--line);
  }

  .subtotal-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--espresso); color:#fff;
    padding:12px 16px; border-radius:var(--radius); margin-top:6px;
    font-weight:600; font-size:14px;
  }
  .subtotal-strip .val{ color:var(--brass); font-size:17px; }

  .cs-group{ margin-bottom:18px; }
  .cs-group h3{ font-size:16px; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  table.cs{ width:100%; border-collapse:collapse; font-size:13px; }
  table.cs th{
    text-align:left; font-size:10.5px; letter-spacing:.5px; color:var(--grey);
    padding:4px 8px; border-bottom:1px solid var(--line); font-weight:600;
  }
  table.cs td{ padding:7px 8px; border-bottom:1px solid #f0ebe0; vertical-align:top; }
  table.cs td.num, table.cs th.num{ text-align:right; white-space:nowrap; }
  table.cs tr.excluded td{ color:#b9b0a2; text-decoration:line-through; }

  .grand{
    background:var(--espresso); color:#fff; border-radius:var(--radius);
    padding:18px 20px; margin-top:20px;
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 8px 24px rgba(38,32,25,.18);
  }
  .grand .label{ font-size:14px; color:#cfc6b8; }
  .grand .value{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:#fff; }
  .grand .value.under{ color:#8fc38f; }
  .grand .value .brass{ color:var(--brass); }
  .cap-note{ font-size:12.5px; margin-top:6px; color:#cfc6b8; }

  button.cta{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    background:var(--brass); color:#fff; border:none;
    padding:11px 18px; border-radius:var(--radius); cursor:pointer;
    box-shadow:0 2px 8px rgba(217,119,87,.35);
  }
  button.cta.ghost{ background:transparent; border:1.5px solid var(--espresso); color:var(--espresso); }
  .actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }

  .foot-note{ font-size:11.5px; color:var(--grey); margin-top:22px; line-height:1.5; }

  .sticky-total{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--espresso); color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.18);
  }
  .sticky-total .l{ font-size:12px; color:#cfc6b8; }
  .sticky-total .v{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--brass); }
  .sticky-total button{
    background:var(--brass); color:var(--espresso); border:none; font-weight:700;
    font-size:12.5px; padding:9px 14px; border-radius:var(--radius); cursor:pointer;
  }

  @media (min-width: 760px){
    .sticky-total{ display:none; }
    main{ padding-bottom:60px; }
  }
  @media (max-width: 759px){
    header.top{ padding:16px 16px 14px; }
    header.top h1{ font-size:20px; line-height:1.2; }
    header.top p{ font-size:12px; line-height:1.4; }
    nav.tabs button{ font-size:12.5px; padding:11px 12px 10px; }
    main{ padding:14px 12px 84px; }
    .item{ padding:11px 12px; }
    .item-top{ flex-wrap:wrap; row-gap:8px; }
    .grand{ padding:15px 16px; flex-wrap:wrap; gap:6px; }
    .grand .value{ font-size:22px; }
    .actions{ flex-direction:column; }
    .actions button{ width:100%; text-align:center; }
  }

  @media print{
    nav.tabs, .showall-bar, .sticky-total, .actions, .toggle-row .switch, header.top .brandline{ display:none !important; }
    section.panel{ display:block !important; }
    section.panel:not(#panel-costsheet){ display:none !important; }
    body{ background:#fff; }
  }

  /* ---------- Reference image gallery / hero / lightbox ---------- */
  .floorplan-wrap{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; text-align:center; margin-bottom:18px;
  }
  .floorplan-wrap img{ max-width:100%; height:auto; border-radius:2px; cursor:pointer; }
  .floorplan-wrap .cap{ margin-top:8px; font-size:12.5px; color:var(--grey); }
  .gallery{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;
  }
  .gallery-item{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    cursor:pointer;
  }
  .gallery-item img{ width:100%; height:110px; object-fit:cover; display:block; }
  .gallery-item .cap{ padding:6px 8px; font-size:11px; color:var(--espresso-soft); font-weight:600; line-height:1.3; }

  .tab-hero{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px;
    margin-bottom:16px;
  }
  .tab-hero .th-item{
    position:relative; border-radius:var(--radius); overflow:hidden; height:130px; background:var(--cream-dk);
  }
  .tab-hero .th-item img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .tab-hero .th-item .cap{
    position:absolute; left:0; right:0; bottom:0; padding:6px 8px;
    background:linear-gradient(transparent, rgba(0,0,0,.55));
    color:#fff; font-size:11px; font-weight:600;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(20,16,12,.92); z-index:200;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:82vh; border-radius:3px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox .lb-cap{ position:absolute; bottom:28px; left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  .lightbox .lb-close{
    position:absolute; top:18px; right:22px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer;
    line-height:1;
  }
  @media (max-width: 759px){
    .tab-hero .th-item{ height:100px; }
    .gallery{ grid-template-columns:repeat(2, 1fr); }
    .gallery-item img{ height:96px; }
  }
  @media print{
    .lightbox{ display:none !important; }
  }
</style>
</head>

function tierOptionsHtml(item, arrName, idx, tierNames){
  return `<div class="options tier-options">${tierNames.map(tn=>{

    const sel = item.selected===tn ? 'selected' : '';
    return `<label class="opt tier-opt ${sel}">
      <input type="radio" name="${arrName}${idx}" ${sel?'checked':''} onchange="setTier('${arrName}',${idx},'${tn}')">
      <span class="brand">${tn} — ${fmt(t.rate)}${item.unit!=="set"&&item.unit!=="No."&&item.unit!=="lumpsum"?("/"+item.unit):""}</span>
      <span class="tier-desc">${t.desc}</span>
    </label>`;
  }).join('')}</div>`;
}

function renderTierItem(item, arrName, idx, tierNames){
  const amt = item.qty * item.tiers[item.selected].rate;
  return `<div class="item">

    </div>
    <div class="item-spec">${item.qty} ${item.unit} × ${fmt(item.tiers[item.selected].rate)} — ${item.selected} tier</div>
    ${tierOptionsHtml(item, arrName, idx, tierNames)}
  </div>`;
}

function renderSanitaryItem(item, idx){

  return `<div class="item">

        <div class="item-title">${item.name}</div>
      </div>

function renderServiceItem(item, idx){
  const amt = item.qty * item.rate;
  const right = item.actuals
    ? `<span class="amount">As per actuals</span>`
    : `<span class="amount ${item.on?'':'off'}">${fmt(amt)}</span>
        <label class="switch"><input type="checkbox" ${item.on?'checked':''} onchange="toggleService(${idx},this.checked)"><span class="slider"></span></label>`;
  const spec = item.actuals ? item.note
    : `${item.qty.toLocaleString('en-IN')} ${item.unit} × ${fmt(item.rate)} — ${item.note}`;
  return `<div class="item">
    <div class="item-top">
      <div>
        <div class="item-room">${item.room}</div>
        <div class="item-title">${item.name}</div>
      </div>
      <div class="toggle-row">${right}</div>
    </div>
    <div class="item-spec">${spec}</div>
  </div>`;
}
function serviceSubtotal(arr){ return arr.reduce((s,i)=> s + (i.on && !i.actuals ? i.qty*i.rate : 0), 0); }

       + tierSubtotal(ceilingItems) + tierSubtotal(flooringItems)
       + (kitchenCabinetItem.on ? kitchenCabinetItem.qty*kitchenCabinetItem.tiers[kitchenCabinetItem.selected].rate : 0)

       + tierSubtotal(masterBedroomItems) + tierSubtotal(secondBedroomItems)
       + sanitarySubtotal(sanitaryItems)
       + tierSubtotal(livingFurnitureItems)
       + serviceSubtotal(serviceItems)

    {title:"F. Sanitaryware & Mirrors", items: sanitaryItems.map(i=>({name:`${i.room} — ${i.name}`, detail:`${i.selected} · ${i.qty} ${i.unit} × ${fmt(i.brands[i.selected].rate)}`, amt:i.qty*i.brands[i.selected].rate, on:i.on}))},

const arrays = {
  mandirItems, livingWoodworkItems, ceilingItems, flooringItems,
  masterBedroomItems, secondBedroomItems, livingFurnitureItems,
};
const kitchenSingleArr = [kitchenCabinetItem, kitchenGraniteItem];

function toggleItem(arrName, idx, val){
  if(arrName==='kitchenSingle'){ kitchenSingleArr[idx].on = val; }
  else { arrays[arrName][idx].on = val; }
  saveState(); renderMain(); restoreTab();
}
function setTier(arrName, idx, tier){
  if(arrName==='kitchenSingle'){ kitchenSingleArr[idx].selected = tier; }
  else { arrays[arrName][idx].selected = tier; }
  saveState(); renderMain(); restoreTab();
}
function setSanitaryBrand(idx, brand){

  saveState(); renderMain(); restoreTab();

function toggleSanitary(idx, val){

  saveState(); renderMain(); restoreTab();
}
function toggleService(idx, val){
  serviceItems[idx].on = val;
  saveState(); renderMain(); restoreTab();

  saveState(); renderMain(); restoreTab();
}

function updateStickyTotal(){

}

/* ---------------- Persistence ---------------- */
const STORAGE_KEY = 'deepanshiCostBuilder_v1';

function saveState(){
  try{
    const state = {
      v:1,
      mandir: mandirItems.map(i=>({on:i.on, selected:i.selected})),
      livingWoodwork: livingWoodworkItems.map(i=>({on:i.on, selected:i.selected})),
      ceiling: ceilingItems.map(i=>({on:i.on, selected:i.selected})),
      flooring: flooringItems.map(i=>({on:i.on, selected:i.selected})),
      kitchenCabinet: {on:kitchenCabinetItem.on, selected:kitchenCabinetItem.selected},
      kitchenGranite: {on:kitchenGraniteItem.on, selected:kitchenGraniteItem.selected},
      master: masterBedroomItems.map(i=>({on:i.on, selected:i.selected})),
      second: secondBedroomItems.map(i=>({on:i.on, selected:i.selected})),
      sanitary: sanitaryItems.map(i=>({on:i.on, selected:i.selected})),
      livingFurniture: livingFurnitureItems.map(i=>({on:i.on, selected:i.selected})),
      services: serviceItems.map(i=>i.on),
      designExecOn: designExecItem.on,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* storage unavailable — fail silently */ }
}

function loadState(){
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
  if(!raw) return;
  let s;
  try{ s = JSON.parse(raw); }catch(e){ return; }
  if(!s || s.v !== 1) return;
  try{
    const apply = (arr, saved) => { if(Array.isArray(saved) && saved.length===arr.length) saved.forEach((v,i)=>{ if(v.selected in arr[i].tiers) arr[i].selected=v.selected; arr[i].on=!!v.on; }); };
    apply(mandirItems, s.mandir);
    apply(livingWoodworkItems, s.livingWoodwork);
    apply(ceilingItems, s.ceiling);
    apply(flooringItems, s.flooring);
    apply(masterBedroomItems, s.master);
    apply(secondBedroomItems, s.second);
    apply(livingFurnitureItems, s.livingFurniture);
    if(s.kitchenCabinet && s.kitchenCabinet.selected in kitchenCabinetItem.tiers){ kitchenCabinetItem.selected=s.kitchenCabinet.selected; kitchenCabinetItem.on=!!s.kitchenCabinet.on; }
    if(s.kitchenGranite && s.kitchenGranite.selected in kitchenGraniteItem.tiers){ kitchenGraniteItem.selected=s.kitchenGranite.selected; kitchenGraniteItem.on=!!s.kitchenGranite.on; }
    if(Array.isArray(s.sanitary) && s.sanitary.length===sanitaryItems.length) s.sanitary.forEach((v,i)=>{ const sel = typeof v==='string' ? v : (v && v.selected); if(sanitaryItems[i].brands[sel]) sanitaryItems[i].selected=sel; if(v && typeof v==='object') sanitaryItems[i].on=!!v.on; });
    if(Array.isArray(s.services) && s.services.length===serviceItems.length) s.services.forEach((v,i)=>{ serviceItems[i].on=!!v; });
    if(typeof s.designExecOn === 'boolean') designExecItem.on = s.designExecOn;
  }catch(e){ /* malformed saved state — ignore and continue with defaults */ }
}

let currentTab = 'overview';
let showAllMode = false;

function goTo(id){
  showAllMode = false;
  currentTab = id;
  applyView(true);
}
function toggleShowAll(){
  showAllMode = !showAllMode;
  applyView(true);
}
function applyView(scrollTop){
  const btn = document.getElementById('showAllBtn');
  if(showAllMode){
    document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.remove('active'));
    document.querySelectorAll('section.panel').forEach(p=> p.classList.add('active'));
    if(btn){ btn.classList.add('active'); btn.textContent = '✕ Show One at a Time'; }
  } else {
    document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===currentTab));
    document.querySelectorAll('section.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+currentTab));
    if(btn){ btn.classList.remove('active'); btn.textContent = '☰ Show All Categories'; }
  }
  if(scrollTop) window.scrollTo({top:0, behavior:'auto'});
}
function restoreTab(){ /* view is re-applied inside renderMain */ }

function resetAll(){
  if(!confirm('Reset all selections to the recommended defaults?')) return;
  mandirItems.forEach(i=>{i.on=true; i.selected='Essential';});
  livingWoodworkItems.forEach(i=>{i.on=true; i.selected='Essential';});
  ceilingItems.forEach(i=>{i.on=true; i.selected='Standard';});
  flooringItems.forEach(i=>{i.on=true; i.selected='Essential';});
  kitchenCabinetItem.on=true; kitchenCabinetItem.selected='Essential';
  kitchenGraniteItem.on=true; kitchenGraniteItem.selected='Essential';
  masterBedroomItems.forEach(i=>{i.on=true; i.selected='Essential';});
  secondBedroomItems.forEach(i=>{i.on=true; i.selected='Essential';});
  sanitaryItems.forEach(i=>{i.on=true; i.selected='Colston';});
  livingFurnitureItems.forEach(i=>{i.on=true; i.selected='Essential';});
  serviceItems.forEach(i=>{i.on=true;});
  designExecItem.on=true;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  renderMain(); restoreTab();
}


function openLightbox(key){
  const img = REF_IMAGES[key];
  if(!img) return;
  document.getElementById('lightboxImg').src = img.src;
  document.getElementById('lightboxCap').innerHTML = img.cap;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e){
  if(e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('open');
}

/* =====================================================================
   INIT
   ===================================================================== */
loadState();
renderTabs();
renderMain();
goTo('overview');
</script>
