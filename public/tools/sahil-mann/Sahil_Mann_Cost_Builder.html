<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahil Mann — 2 BHK DDA Residence — Cost Builder | Indéva Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2B2420;
    --espresso-soft:#4a4038;
    --brass:#C9A66B;
    --brass-dark:#a5824e;
    --cream:#F4F1EC;
    --cream-dk:#EAE4D6;
    --card:#FFFFFF;
    --line:#E1D8C6;
    --grey:#7a7168;
    --good:#5c7a5c;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--espresso);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Cormorant Garamond', Georgia, serif; }

  /* ---------- Header ---------- */
  header.top{
    background:var(--espresso);
    color:var(--cream);
    padding:22px 24px 20px;
  }
  header.top .brandline{
    font-size:11px; letter-spacing:2px; color:var(--brass); font-weight:600;
    margin-bottom:6px;
  }
  header.top h1{
    font-size:30px; font-weight:600; margin:0 0 4px; color:#fff; line-height:1.15;
  }
  header.top p{
    margin:0; color:#cfc6b8; font-size:13.5px;
  }

  /* ---------- Nav tabs ---------- */
  nav.tabs{
    position:sticky; top:0; z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    background:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13.5px; font-weight:600; color:var(--grey);
    padding:14px 16px 12px;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--espresso);
    border-bottom-color:var(--brass);
  }
  nav.tabs button .n{
    display:inline-block; min-width:16px; text-align:center;
    font-size:10.5px; color:var(--brass-dark); margin-left:5px;
  }

  main{ max-width:960px; margin:0 auto; padding:20px 16px 100px; }

  section.panel{ display:none; }
  section.panel.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .panel-head{ margin-bottom:16px; }
  .panel-head h2{ font-size:24px; margin:0 0 4px; font-weight:600; }
  .panel-head p{ margin:0; color:var(--grey); font-size:13.5px; max-width:65ch; }

  /* ---------- Item card ---------- */
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .item-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:6px;
  }
  .item-left{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .item-thumb{
    width:64px; height:64px; object-fit:cover; border-radius:3px; flex:0 0 auto;
    border:1px solid var(--line); cursor:pointer; background:var(--cream);
  }
  .item-title{ font-weight:600; font-size:14.5px; }
  .item-room{ font-size:11.5px; color:var(--brass-dark); font-weight:600; }
  .item-spec{ font-size:12.5px; color:var(--grey); margin:4px 0 8px; line-height:1.45; }
  .item-meta{ font-size:12px; color:var(--grey); }

  .toggle-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; width:38px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; cursor:pointer; inset:0;
    background:#d8cfbe; border-radius:22px; transition:.15s;
  }
  .slider:before{
    content:""; position:absolute; height:16px; width:16px; left:3px; top:3px;
    background:white; border-radius:50%; transition:.15s;
  }
  input:checked + .slider{ background:var(--brass); }
  input:checked + .slider:before{ transform:translateX(16px); }

  .amount{ font-weight:700; font-size:15px; white-space:nowrap; }
  .amount.off{ color:#b9b0a2; text-decoration:line-through; }

  /* ---------- Option chips (brand / tier selection) ---------- */
  .options{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .opt{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:8px 12px;
    cursor:pointer;
    min-width:118px;
    background:#fff;
    transition:border-color .12s, background .12s;
  }
  .opt:hover{ border-color:var(--brass); }
  .opt.selected{ border-color:var(--brass-dark); background:var(--cream-dk); }
  .opt input{ display:none; }
  .opt .brand{ font-weight:700; font-size:13px; display:block; }
  .opt .rate{ font-size:12.5px; color:var(--espresso-soft); margin-top:2px; }
  .opt .warranty{
    display:inline-block; margin-top:5px; font-size:10.5px; font-weight:600;
    color:var(--good); border:1px solid #c7d6c7; background:#f1f6f1;
    padding:1px 7px; border-radius:20px;
  }
  .opt .warranty.none{ color:#9c7b3f; border-color:#e5d3ad; background:#fbf4e6; }
  .opt.na{ opacity:.4; cursor:not-allowed; }

  /* Tier options (Essential/Economy/Budget) — full-width stacked, description-led */
  .tier-options{ flex-direction:column; }
  .opt.tier-opt{ width:100%; min-width:0; display:flex; flex-direction:column; gap:2px; padding:10px 12px; }
  .opt.tier-opt .brand{ font-size:13px; }
  .tier-desc{ font-size:12px; color:var(--grey); line-height:1.4; }
  .opt-tag{
    display:inline-block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;
    color:var(--brass-dark); border:1px solid #e5d3ad; background:#fbf4e6; padding:1px 6px; border-radius:20px;
    margin-left:6px; vertical-align:middle;
  }

  /* ---------- Tab hero banner ---------- */
  .tab-hero{
    position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:16px;
    height:160px; background:var(--cream-dk);
  }
  .tab-hero img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .tab-hero .cap{
    position:absolute; left:0; right:0; bottom:0; padding:8px 12px;
    background:linear-gradient(transparent, rgba(0,0,0,.55));
    color:#fff; font-size:12px; font-weight:600;
  }

  /* ---------- Overview gallery ---------- */
  .floorplan-wrap{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; text-align:center; margin-bottom:18px;
  }
  .floorplan-wrap img{ max-width:100%; height:auto; border-radius:2px; cursor:pointer; }
  .floorplan-wrap .cap{ margin-top:8px; font-size:12.5px; color:var(--grey); }
  .gallery{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;
  }
  .gallery-item{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    cursor:pointer;
  }
  .gallery-item img{ width:100%; height:110px; object-fit:cover; display:block; }
  .gallery-item .cap{ padding:6px 8px; font-size:11px; color:var(--espresso-soft); font-weight:600; line-height:1.3; }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,16,12,.92); z-index:200;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:82vh; border-radius:3px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox .lb-cap{ position:absolute; bottom:28px; left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  .lightbox .lb-close{
    position:absolute; top:18px; right:22px; color:#fff; font-size:28px; background:none; border:none; cursor:pointer;
    line-height:1;
  }

  .divider-note{
    font-size:11.5px; color:var(--grey); font-style:italic; margin:10px 2px 16px;
    padding-left:10px; border-left:2px solid var(--line);
  }

  /* ---------- Section subtotal strip ---------- */
  .subtotal-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--espresso); color:#fff;
    padding:12px 16px; border-radius:var(--radius); margin-top:6px;
    font-weight:600; font-size:14px;
  }
  .subtotal-strip .val{ color:var(--brass); font-size:17px; }

  /* ---------- Cost sheet ---------- */
  .cs-group{ margin-bottom:18px; }
  .cs-group h3{ font-size:16px; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  table.cs{ width:100%; border-collapse:collapse; font-size:13px; }
  table.cs th{
    text-align:left; font-size:10.5px; letter-spacing:.5px; color:var(--grey);
    padding:4px 8px; border-bottom:1px solid var(--line); font-weight:600;
  }
  table.cs td{ padding:7px 8px; border-bottom:1px solid #f0ebe0; vertical-align:top; }
  table.cs td.num, table.cs th.num{ text-align:right; white-space:nowrap; }
  table.cs tr.excluded td{ color:#b9b0a2; text-decoration:line-through; }

  .grand{
    background:var(--espresso); color:#fff; border-radius:var(--radius);
    padding:18px 20px; margin-top:20px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .grand .label{ font-size:14px; color:#cfc6b8; }
  .grand .value{ font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:700; color:#fff; }
  .grand .value .brass{ color:var(--brass); }

  .actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button.cta{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    background:var(--brass); color:var(--espresso); border:none;
    padding:11px 18px; border-radius:var(--radius); cursor:pointer;
  }
  button.cta.ghost{ background:transparent; border:1.5px solid var(--espresso); color:var(--espresso); }

  .foot-note{ font-size:11.5px; color:var(--grey); margin-top:22px; line-height:1.5; }

  /* ---------- Sticky bottom total (mobile) ---------- */
  .sticky-total{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--espresso); color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 -4px 14px rgba(0,0,0,.18);
  }
  .sticky-total .l{ font-size:12px; color:#cfc6b8; }
  .sticky-total .v{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700; color:var(--brass); }
  .sticky-total button{
    background:var(--brass); color:var(--espresso); border:none; font-weight:700;
    font-size:12.5px; padding:9px 14px; border-radius:var(--radius); cursor:pointer;
  }

  @media (min-width: 760px){
    .sticky-total{ display:none; }
    main{ padding-bottom:60px; }
  }
  @media (max-width: 759px){
    header.top{ padding:16px 16px 14px; }
    header.top .brandline{ font-size:9.5px; letter-spacing:1.5px; margin-bottom:4px; }
    header.top h1{ font-size:21px; line-height:1.2; }
    header.top p{ font-size:12px; line-height:1.4; }

    nav.tabs button{ font-size:12.5px; padding:11px 12px 10px; }

    main{ padding:14px 12px 84px; }
    .panel-head{ margin-bottom:12px; }
    .panel-head h2{ font-size:19px; }
    .panel-head p{ font-size:12.5px; }

    .tab-hero{ height:110px; margin-bottom:12px; }
    .tab-hero .cap{ font-size:11px; padding:6px 10px; }

    .item{ padding:11px 12px; }
    .item-top{ flex-wrap:wrap; row-gap:8px; }
    .item-title{ font-size:13.5px; }
    .item-spec{ font-size:12px; }
    .item-thumb{ width:52px; height:52px; }
    .amount{ font-size:14px; }

    /* bigger, easier touch targets */
    .switch{ width:42px; height:25px; }
    .slider:before{ height:19px; width:19px; }
    input:checked + .slider:before{ transform:translateX(17px); }

    .opt{ padding:10px 11px; }
    .opt .brand{ font-size:12.5px; }
    .tier-desc{ font-size:11.5px; }

    .floorplan-wrap{ padding:10px; }
    .gallery{ grid-template-columns:repeat(2, 1fr); gap:8px; }
    .gallery-item img{ height:96px; }
    .gallery-item .cap{ font-size:10.5px; padding:5px 7px; }

    table.cs{ font-size:12px; }
    table.cs th{ font-size:9.5px; }
    .cs-group h3{ font-size:14.5px; }

    .grand{ padding:15px 16px; flex-wrap:wrap; gap:6px; }
    .grand .value{ font-size:23px; }

    .actions{ flex-direction:column; }
    .actions button{ width:100%; text-align:center; }

    .sticky-total{ padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .sticky-total .v{ font-size:19px; }
    .sticky-total button{ padding:11px 16px; font-size:13px; }

    .lightbox{ padding:14px; }
    .lightbox .lb-close{ top:10px; right:14px; font-size:26px; }
  }

  @media (max-width: 359px){
    header.top h1{ font-size:19px; }
    .item-thumb{ width:44px; height:44px; }
    .gallery{ grid-template-columns:1fr 1fr; }
  }

  @media print{
    nav.tabs, .sticky-total, .actions, .toggle-row input, header.top .brandline{ display:none !important; }
    section.panel{ display:block !important; }
    section.panel:not(#panel-costsheet){ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brandline">INDÉVA STUDIO · INTERACTIVE COST BUILDER</div>
  <h1>Sahil Mann — 2 BHK DDA Residence</h1>
  <p>Pocket 9, Sector A1–A4, Narela, Delhi · Tap a category, pick your options, and your cost sheet builds itself.</p>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox(event)">&times;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lb-cap" id="lightboxCap"></div>
</div>

<div class="sticky-total" id="stickyTotal">
  <div>
    <div class="l">Running total</div>
    <div class="v" id="stickyValue">₹0</div>
  </div>
  <button onclick="goTo('costsheet')">View cost sheet</button>
</div>

const fmt = n => "₹" + Math.round(n).toLocaleString("en-IN");

const TABS = [
  {id:"overview", label:"Overview"},
  {id:"woodwork", label:"Woodwork"},
  {id:"furniture", label:"Furniture"},
  {id:"ceiling", label:"False Ceiling"},
  {id:"lighting", label:"Lighting"},
  {id:"paint", label:"Painting"},
  {id:"hardware", label:"Door Hardware"},
  {id:"costsheet", label:"Cost Sheet"},
];

function warrantyPill(years){
  if(!years || years === 0) return `<span class="warranty none">No warranty</span>`;
  return `<span class="warranty">${years}-yr warranty</span>`;
}

function sumTiered(items){ return items.reduce((s,i)=> s + (i.on ? i.qty*i.tiers[i.selected].rate : 0), 0); }
function woodworkTotal(){ return sumTiered(woodworkItems); }
function furnitureTotal(){ return sumTiered(furnitureItems); }
function ceilingTotal(){
  return ceilingItems.reduce((s,i)=> s + (i.on ? i.qty*i.tiers[i.selected].rate : 0), 0);
}
function lightingTotal(){
  let t = lightingItems.reduce((s,i)=> s + i.qty*i.brands[i.selected].rate, 0);
  if(electricalExecution.on) t += electricalExecution.qty*electricalExecution.rate + electricalExecution.dbLumpsum;
  return t;
}
function paintTotal(){
  let t = paintLine.qty * paintOptions[paintLine.selected].rate;
  t += paintFixed.reduce((s,i)=> s + (i.on ? i.qty*i.rate : 0), 0);
  return t;
}
function doorHardwareTotal(){
  let t = doorHardwareItems.reduce((s,i)=> s + i.qty*i.brands[i.selected].rate, 0);
  if(doorRefurbish.on) t += doorRefurbish.qty*doorRefurbish.rate;
  return t;
}
function grandTotal(){
  return woodworkTotal()+furnitureTotal()+ceilingTotal()+lightingTotal()+paintTotal()+doorHardwareTotal();
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" onclick="goTo('${t.id}')">${t.label}</button>`).join('');
}

function renderSimpleItem(item, idx, arrName){
  const amt = item.qty*item.rate;
  return `
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-title">${item.name}</div>
      </div>
      <div class="toggle-row">
        <div class="amount ${item.on?'':'off'}">${fmt(amt)}</div>
        <label class="switch">
          <input type="checkbox" ${item.on?'checked':''} onchange="toggleSimple('${arrName}',${idx},this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="item-meta">${item.qty} ${item.unit} × ${fmt(item.rate)}</div>
  </div>`;
}

function renderTierItem(item, idx, arrName){
  const tierNames = Object.keys(item.tiers);
  const amt = item.on ? item.qty*item.tiers[item.selected].rate : 0;
  const optsHtml = tierNames.map(t=>{
    const d = item.tiers[t];
    const sel = item.selected===t ? 'selected':'';
    return `<label class="opt tier-opt ${sel}">
      <input type="radio" name="${arrName}-${idx}" ${sel?'checked':''} onchange="setTier('${arrName}',${idx},'${t}')">
      <span class="brand">${t} — ${fmt(d.rate)}${item.unit==='RFT'?'/RFT':(item.unit==='sq.ft.'?'/sq.ft.':'/pc')}</span>
      <span class="tier-desc">${d.desc}</span>
    </label>`;
  }).join('');
  const thumb = item.imgKey && IMAGES[item.imgKey]
    ? `<img class="item-thumb" src="${IMAGES[item.imgKey].src}" alt="${IMAGES[item.imgKey].label}" onclick="openLightbox('${item.imgKey}')">`
    : '';
  return `
  <div class="item">
    <div class="item-top">
      <div class="item-left">
        ${thumb}
        <div>
          <div class="item-room">${item.room}</div>
          <div class="item-title">${item.name}${item.optional?' <span class="opt-tag">optional</span>':''}</div>
        </div>
      </div>
      <div class="toggle-row">
        <div class="amount ${item.on?'':'off'}">${fmt(amt)}</div>
        <label class="switch">
          <input type="checkbox" ${item.on?'checked':''} onchange="toggleSimple('${arrName}',${idx},this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="item-meta">${item.qty} ${item.unit}</div>
    <div class="options tier-options">${optsHtml}</div>
  </div>`;
}

function renderBrandItem(item, idx, kind){
  const opts = Object.keys(item.brands).map(b=>{
    const d = item.brands[b];
    if(!d) return `<div class="opt tier-opt na"><span class="brand">${b}</span><span class="tier-desc">No equivalent product</span></div>`;
    const sel = item.selected===b ? 'selected':'';
    return `<label class="opt tier-opt ${sel}">
      <input type="radio" name="${kind}-${idx}" ${sel?'checked':''} onchange="setBrand('${kind}',${idx},'${b}')">
      <span class="brand">${b} — ${fmt(d.rate)}${item.unit==='RFT'?'/RFT':(item.unit==='No.'?'/pc':'')} ${warrantyPill(d.warranty)}</span>
      <span class="tier-desc">${BRAND_NOTES[b] || ''}</span>
    </label>`;
  }).join('');
  const amt = item.qty * item.brands[item.selected].rate;
  const thumb = item.imgKey && IMAGES[item.imgKey]
    ? `<img class="item-thumb" src="${IMAGES[item.imgKey].src}" alt="${IMAGES[item.imgKey].label}" onclick="openLightbox('${item.imgKey}')">`
    : '';
  return `
  <div class="item">
    <div class="item-top">
      <div class="item-left">
        ${thumb}
        <div class="item-title">${item.name}</div>
      </div>
      <div class="amount">${fmt(amt)}</div>
    </div>
    <div class="item-spec">${item.spec}</div>
    <div class="item-meta">Qty: ${item.qty} ${item.unit}</div>
    <div class="options tier-options">${opts}</div>
  </div>`;
}

  const img = IMAGES[key];

    <div class="cap">${img.label}</div>

function renderOverviewPanel(){
  const galleryKeys = ['cover','living_tv','living_wide','foyer','kitchen','wardrobe','master','master_balcony','second','second_wide','material1','material2'];

    const img = IMAGES[k];

      <img src="${img.src}" alt="${img.label}">

  return panel('overview', 'Floor Plan & Design Renders', 'The approved floor plan and 3D design renders this cost sheet is based on. Tap any image to view it larger.',

       <div class="cap">${IMAGES.floorplan.label} — Carpet area 73.938 sqm (≈795.9 sq.ft.)</div>
     </div>
     <div class="gallery">${items}</div>`
  );
}

function openLightbox(key){
  const img = IMAGES[key];
  if(!img) return;
  document.getElementById('lightboxImg').src = img.src;
  document.getElementById('lightboxCap').textContent = img.label;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e){
  if(e.target.id === 'lightboxImg') return;
  document.getElementById('lightbox').classList.remove('open');
}

function panel(id, title, desc, body){
  return `<section class="panel" id="panel-${id}">
    <div class="panel-head"><h2>${title}</h2><p>${desc}</p></div>
    ${body}
  </section>`;
}

function subtotalStrip(label, fn){
  return `<div class="subtotal-strip"><span>${label} subtotal</span><span class="val">${fmt(fn())}</span></div>`;
}

function renderElecExecution(){
  const amt = electricalExecution.on ? electricalExecution.qty*electricalExecution.rate + electricalExecution.dbLumpsum : 0;
  return `
  <div class="item">
    <div class="item-top">
      <div>
        <div class="item-title">Electrical Point Wiring & Execution</div>
      </div>
      <div class="toggle-row">
        <div class="amount ${electricalExecution.on?'':'off'}">${fmt(amt)}</div>
        <label class="switch">
          <input type="checkbox" ${electricalExecution.on?'checked':''} onchange="toggleElec(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="item-spec">Labour only, brand-neutral — 58 points (light + fan + socket + power, provisional) at ₹450/point, plus ₹3,500 DB modification/concealed wiring lumpsum.</div>
  </div>`;
}

function renderPaintLine(){
  const opts = Object.keys(paintOptions).map(name=>{
    const d = paintOptions[name];
    const sel = paintLine.selected===name ? 'selected':'';
    return `<label class="opt tier-opt ${sel}">
      <input type="radio" name="paintline" ${sel?'checked':''} onchange="setPaintLine('${name}')">
      <span class="brand">${name} — ₹${d.rate}/L ${warrantyPill(d.warranty)}</span>
      <span class="tier-desc">${d.desc}</span>
    </label>`;
  }).join('');
  const amt = paintLine.qty * paintOptions[paintLine.selected].rate;
  return `
  <div class="item">
    <div class="item-top">
      <div class="item-title">Emulsion Paint (40L allowance)</div>
      <div class="amount">${fmt(amt)}</div>
    </div>
    <div class="item-spec">Buying as 2 × 20L buckets is cheaper per litre than smaller cans. Warranty shown is the product's washability / performance assurance, not a legal defect warranty — confirm exact terms with the dealer.</div>
    <div class="options tier-options">${opts}</div>
  </div>`;
}

function renderCostSheet(){
  const groups = [
    {title:"A. Fixed Woodwork", items:woodworkItems.map(i=>({name:`${i.room} — ${i.name}`, detail:`${i.selected} tier · ${i.qty} ${i.unit} × ${fmt(i.tiers[i.selected].rate)}`, amt:i.qty*i.tiers[i.selected].rate, on:i.on}))},
    {title:"B. Loose Furniture", items:furnitureItems.map(i=>({name:`${i.room} — ${i.name}`, detail:`${i.selected} tier · ${i.qty} ${i.unit} × ${fmt(i.tiers[i.selected].rate)}`, amt:i.qty*i.tiers[i.selected].rate, on:i.on}))},
    {title:"C. False Ceiling", items:ceilingItems.map(i=>({name:`${i.room} — ${i.name}`, detail:`${i.selected} tier · ${i.qty} sq.ft. × ₹${i.tiers[i.selected].rate}`, amt:i.qty*i.tiers[i.selected].rate, on:i.on}))},
    {title:"D. Electrical & Lighting", items:[
      ...lightingItems.map(i=>({name:i.name, detail:`${i.selected} · ${i.qty} ${i.unit} × ${fmt(i.brands[i.selected].rate)}`, amt:i.qty*i.brands[i.selected].rate, on:true})),
      {name:"Electrical Point Wiring & Execution", detail:`${electricalExecution.qty} pts × ${fmt(electricalExecution.rate)} + ${fmt(electricalExecution.dbLumpsum)} DB lumpsum`, amt:electricalExecution.qty*electricalExecution.rate+electricalExecution.dbLumpsum, on:electricalExecution.on},
    ]},
    {title:"E. Painting", items:[
      {name:`Asian Paints ${paintLine.selected}`, detail:`${paintLine.qty} L × ${fmt(paintOptions[paintLine.selected].rate)}`, amt:paintLine.qty*paintOptions[paintLine.selected].rate, on:true},
      ...paintFixed.map(i=>({name:i.name, detail:`${i.qty} ${i.unit} × ${fmt(i.rate)}`, amt:i.qty*i.rate, on:i.on})),
    ]},
    {title:"F. Door Hardware", items:[
      ...doorHardwareItems.map(i=>({name:i.name, detail:`${i.selected} · ${i.qty} × ${fmt(i.brands[i.selected].rate)}`, amt:i.qty*i.brands[i.selected].rate, on:true})),
      {name:doorRefurbish.name, detail:`${doorRefurbish.qty} sq.ft. × ${fmt(doorRefurbish.rate)}`, amt:doorRefurbish.qty*doorRefurbish.rate, on:doorRefurbish.on},
    ]},
  ];

  const groupHtml = groups.map(g=>{
    const rows = g.items.map(it=>`
      <tr class="${it.on?'':'excluded'}">
        <td>${it.name}<br><span style="color:#9a9184;font-size:11px;">${it.detail}</span></td>
        <td class="num">${fmt(it.amt)}</td>
      </tr>`).join('');
    const subtotal = g.items.reduce((s,it)=> s + (it.on?it.amt:0), 0);
    return `<div class="cs-group">
      <h3>${g.title} <span style="float:right;color:var(--brass-dark);">${fmt(subtotal)}</span></h3>
      <table class="cs"><thead><tr><th>Item</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');

  return `<section class="panel" id="panel-costsheet">
    <div class="panel-head">
      <h2>Cost Sheet</h2>
      <p>This updates live as selections change on every tab. Use Print to save a PDF copy for Sahil.</p>
    </div>
    ${groupHtml}
    <div class="grand">
      <span class="label">Grand Total</span>
      <span class="value">${fmt(grandTotal())}</span>
    </div>
    <div class="actions">
      <button class="cta" onclick="window.print()">Print / Save as PDF</button>
      <button class="cta ghost" onclick="resetAll()">Reset to defaults</button>
    </div>
    <p class="foot-note">
      Excludes GST, transportation, countertop/backsplash/sink vendor items already itemised above, mattresses, loose decor, appliances, glass &amp; mirror work, and civil/structural/plumbing work.
      Rates are 2026 Delhi NCR indicative market rates — confirm exact SKU and dealer price before ordering. Warranty periods shown are typical manufacturer terms and should be confirmed against the specific product at purchase.
    </p>
  </section>`;
}

/* =====================================================================
   INTERACTIONS
   ===================================================================== */
const arrays = { woodworkItems, furnitureItems, paintFixed, ceilingItems };

function toggleSimple(arrName, idx, val){
  arrays[arrName][idx].on = val;
  renderMain(); restoreTab();
}
function setTier(arrName, idx, tier){
  arrays[arrName][idx].selected = tier;
  renderMain(); restoreTab();
}
function toggleElec(val){ electricalExecution.on = val; renderMain(); restoreTab(); }
function setBrand(kind, idx, brand){
  const arr = kind==='light' ? lightingItems : doorHardwareItems;
  arr[idx].selected = brand;
  renderMain(); restoreTab();
}
function toggleDoorRefurbish(val){ doorRefurbish.on = val; renderMain(); restoreTab(); }
function setPaintLine(name){ paintLine.selected = name; renderMain(); restoreTab(); }

function updateStickyTotal(){
  document.getElementById('stickyValue').textContent = fmt(grandTotal());
}

let currentTab = 'woodwork';
function goTo(id){
  currentTab = id;
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('section.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+id));
  window.scrollTo({top:0, behavior:'instant'});
}
function restoreTab(){ goTo(currentTab); }

function resetAll(){
  if(!confirm('Reset all selections to the recommended defaults?')) return;
  woodworkItems.forEach(i=>{i.on=true; i.selected='Essential';});
  furnitureItems.forEach(i=>{i.on=true; i.selected='Essential';});
  ceilingItems.forEach(i=>{i.on = !i.optional; i.selected='Standard';});
  lightingItems.forEach(i=>i.selected='Wipro');
  electricalExecution.on = true;
  paintLine.selected = 'Royale Matt Luxury Emulsion';
  paintFixed.forEach(i=>i.on=true);
  doorHardwareItems.forEach(i=>i.selected='Dorset');
  doorRefurbish.on = true;
  renderMain(); restoreTab();
}

/* =====================================================================
   INIT
   ===================================================================== */
renderTabs();
renderMain();
goTo('overview');
</script>
</body>
</html>
