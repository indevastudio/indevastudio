<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F5F0">
<title>Project Statement | Indeva Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/auth-kit.js"></script>
<style>
:root{
  --paper:#F5F5F0; --card:#FFFFFF; --ink:#1E2422; --muted:#6B706C; --line:#DCDDD5;
  --brass:#8C6A2E; --in:#2E6A4C; --out:#A5432F; --focus:#2B5FA8;
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .in{color:var(--in)}
[hidden]{display:none !important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;display:grid;gap:14px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;font-size:16px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{padding:6px 10px;font-size:13px}
header{border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.top{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.brand{font-weight:800;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0;font-size:20px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpis div{border-top:2px solid var(--line);padding-top:8px}
.kpis span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.kpis b{font-size:20px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:7px 4px;font-size:13px}
td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
.r{text-align:right;white-space:nowrap}
tr.sum td{font-weight:700}
tr.group td{padding-top:14px;border-bottom:0}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.due{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--out);border:1px solid var(--out);border-radius:999px;padding:0 7px;white-space:nowrap}
tr.duerow td{background:#FBF1EE}
.empty{color:var(--muted);padding:24px 0;text-align:center}
details.bd{margin-top:4px}
details.bd summary{cursor:pointer;list-style:none}
details.bd .bd-link{display:block;color:var(--brass,#8C6A2E);font-size:12px;font-weight:600}
details.bd .bd-label{color:var(--ink)}
details.bd summary::-webkit-details-marker{display:none}
details.bd .bd-link::before{content:"▸ "} details.bd[open] .bd-link::before{content:"▾ "}
details.bd{margin-top:0}
details.bd h4{margin:10px 0 2px;font-size:12px;font-weight:700}
details.bd table{width:100%;border-collapse:collapse;font-size:12px;margin:0}
details.bd th,details.bd td{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left;font-weight:500}
details.bd th{color:var(--muted);font-weight:600}
details.bd td:last-child,details.bd th:last-child{text-align:right;white-space:nowrap}
details.bd ul{margin:4px 0 0;padding-left:18px;font-size:12px;color:var(--muted)}
.appr{margin-top:5px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.appr .btn{padding:3px 10px;font-size:12px;border-color:var(--in);color:var(--in);background:#fff}
.appr .btn.confirm{background:var(--in);color:#fff}
.appr .btn:disabled{opacity:.6;cursor:default}
.appr .ok{font-size:12px;font-weight:700;color:#fff;background:var(--in);border:1px solid var(--in);border-radius:8px;padding:3px 10px;white-space:nowrap;cursor:default}
.appr .when{font-size:11px;color:var(--muted);white-space:nowrap}
.appr .chg{font-size:11px;color:var(--out);white-space:nowrap}
.appr .err{font-size:11px;color:var(--out)}
.print-head{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff}
  body{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header{display:none}
  main{max-width:none;padding:0}
  .print-head{display:block;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
  .print-head .ph-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .print-head b{font-size:20px;font-weight:800}
  .print-head .ph-meta{font-size:11px;color:var(--muted);text-align:right}
  .print-head .ph-addr{font-size:11px;color:var(--muted);margin-top:2px}
  .card{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px;break-inside:auto}
  .card h2{font-size:16px;break-after:avoid}
  .card:last-child{break-inside:avoid}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpis b{font-size:16px}
  .scroll{overflow:visible}
  table{font-size:12px}
  tr,details.bd table tr{break-inside:avoid}
  thead{display:table-header-group}
  details.bd summary .bd-link{display:none}
  details.bd > :not(summary){display:block}
  .appr .btn,.appr .chg,.appr .err{display:none}
}
</style>
</head>
<body>

<section class="login" id="login">
  <form id="loginForm">
    <div><h1>Your project statement</h1><div class="muted">Indeva Studio · sign in with the email and password shared with you</div></div>
    <label>Email<input type="email" id="lgEmail" autocomplete="username" required></label>
    <label>Password<input type="password" id="lgPass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="loginMsg" style="color:var(--out)" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header><div class="top">
    <div class="brand">Indeva Studio<small id="who"></small></div>
    <button class="btn small primary" id="printPdf" title="Download as PDF or print">PDF / Print</button>
    <button class="btn small" id="refresh">Refresh</button>
    <button class="btn small" id="signOut">Sign out</button>
  </div></header>
  <main id="out"></main>
</div>

<script>
const sb = supabase.createClient("https://rolarfaotykmprzvcmgh.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbGFyZmFvdHlrbXByenZjbWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTI1OTgsImV4cCI6MjEwMjQ2ODU5OH0.B7mIRJLh9Q7rzQvrGguqjlhzIMgmoJmiq29Kl6lRkPI");
AuthKit.init(sb, { form: "#loginForm", email: "#lgEmail", password: "#lgPass", changeBefore: "#signOut", changeHtml: "Password" });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bdHtml = (b, internal, label) => {
  if (!b || !Array.isArray(b.sections) || !b.sections.length) return "";
  const n = b.sections.reduce((t, s) => t + (s.rows || []).length, 0);
  const sec = (s) => `<h4>${esc(s.name)}</h4><table><thead><tr>${(s.cols || []).map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${(s.rows || []).map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const list = (h, a) => (a && a.length ? `<h4>${h}</h4><ul>${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
  if (!label) return "";
  return `<details class="bd"><summary><span class="bd-label">${label}</span> <span class="bd-link">View ${esc(b.title || "breakdown")} · ${n} items</span></summary>${b.sections.map(sec).join("")}${internal ? list("Pending points (internal)", b.pending) + list("Verify before procurement (internal)", b.notes) : ""}</details>`;
};
const inr = (n) => "₹" + Math.round(Number(n || 0)).toLocaleString("en-IN");
const MODE = { cash: "Cash", upi: "UPI", bank_transfer: "Bank transfer", cheque: "Cheque", card: "Card", other: "Other" };
const fmtDate = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const fmtTs = (t) => new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lgEmail").value.trim(), password: $("#lgPass").value });
  if (error) $("#loginMsg").textContent = "Sign-in failed: " + error.message;
});
$("#signOut").addEventListener("click", () => sb.auth.signOut());
$("#refresh").addEventListener("click", load);
// PDF / Print: open every breakdown so the printed copy shows the full detail, then restore.
let openedForPrint = [];
window.addEventListener("beforeprint", () => {
  openedForPrint = [...document.querySelectorAll("details.bd:not([open])")];
  openedForPrint.forEach((d) => (d.open = true));
  const ph = document.querySelector(".print-head .ph-date");
  if (ph) ph.textContent = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
});
window.addEventListener("afterprint", () => { openedForPrint.forEach((d) => (d.open = false)); openedForPrint = []; });
// Approve a billing line: first tap asks to confirm, second tap approves.
$("#out").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-approve]");
  if (!b || b.disabled) return;
  if (!b.classList.contains("confirm")) {
    b.classList.add("confirm"); b.textContent = "Tap to confirm";
    setTimeout(() => { if (!b.disabled) { b.classList.remove("confirm"); b.textContent = "Approve"; } }, 4000);
    return;
  }
  b.disabled = true; b.textContent = "Approving…";
  // Records the approval and emails the client a confirmation.
  const { data, error } = await sb.functions.invoke("client-approve", { body: { item_id: b.dataset.approve } });
  const box = b.parentElement;
  if (error || !data || !data.ok) {
    b.disabled = false; b.classList.remove("confirm"); b.textContent = "Approve";
    if (!box.querySelector(".err")) box.insertAdjacentHTML("beforeend", `<span class="err">Could not approve. Please try again.</span>`);
    return;
  }
  box.innerHTML = `<button class="ok" type="button" disabled aria-label="Approved">✓ Approved</button><span class="when">${fmtTs(data.approved_at)}${data.mail && data.mail.sent ? " · Confirmation emailed" : ""}</span>`;
});
$("#printPdf").addEventListener("click", () => {
  const p = window.__stmtProject;
  const prev = document.title;
  if (p) document.title = `Indeva Studio - ${p.name} - Statement`;
  window.print();
  setTimeout(() => (document.title = prev), 1000);
});
sb.auth.onAuthStateChange((_e, session) => {
  $("#login").hidden = !!session; $("#app").hidden = !session;
  if (session) { $("#who").textContent = session.user.email; load(); }
});

async function load() {
  $("#out").innerHTML = `<div class="empty">Loading…</div>`;
  const { data, error } = await sb.rpc("et_client_statement");
  if (error) { $("#out").innerHTML = `<div class="empty">Could not load your statement. Please try again.</div>`; return; }
  if (!data || !data.length) { $("#out").innerHTML = `<div class="empty">No project is linked to this account yet. Please contact Indeva Studio at hello@indevastudio.com.</div>`; return; }
  window.__stmtProject = data[0] && data[0].project;
  const today = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  const printHead = `<div class="print-head"><div class="ph-top"><div><b>Indeva Studio</b><div class="ph-addr">34/11, Lampur, Narela, Delhi – 110040 · GSTIN 07KJDPS5276J1ZG · hello@indevastudio.com</div></div>
    <div class="ph-meta">Project statement<br>As on <span class="ph-date">${today}</span></div></div></div>`;
  $("#out").innerHTML = printHead + data.map(render).join("");
}

function render(s) {
  const items = s.items || [], receipts = s.receipts || [];
  const priced = items.filter((i) => i.pricing_status === "priced");
  const work = priced.filter((i) => i.line_type === "work"), prov = priced.filter((i) => i.line_type === "provision");
  const incl = priced.filter((i) => i.line_type === "included");
  const pending = items.filter((i) => i.pricing_status === "pending");
  const sum = (a) => a.reduce((t, i) => t + Number(i.amount || 0), 0);
  const subtotal = sum(work), provTotal = sum(prov), total = subtotal + provTotal;
  const received = receipts.reduce((t, r) => t + Number(r.amount || 0), 0), balance = total - received;
  const qty = (i) => (i.qty ? `<div class="muted" style="font-size:12px">${Number(i.qty)} ${esc(i.unit || "")}${i.rate ? " @ " + inr(i.rate) : ""}</div>` : "");
  const dueTag = (i) => (Number(i.due) > 0 ? `<br><span class="due">${Number(i.due) < Number(i.amount) ? "Due " + inr(i.due) : "Due"}</span>` : "");
  const appr = (i) => {
    if (!i.id) return "";
    if (i.approved_at) return `<div class="appr"><button class="ok" type="button" disabled aria-label="Approved">✓ Approved</button><span class="when">${fmtTs(i.approved_at)}</span></div>`;
    return `<div class="appr">${i.approval_changed ? `<span class="chg">Amount changed, please approve again</span>` : ""}<button class="btn" type="button" data-approve="${esc(i.id)}">Approve</button></div>`;
  };
  const row = (i) => `<tr class="${Number(i.due) > 0 ? "duerow" : ""}"><td>${i.breakdown ? bdHtml(i.breakdown, false, esc(i.item)) : esc(i.item)}${qty(i)}</td><td class="r">${inr(i.amount)}${dueTag(i)}${appr(i)}</td></tr>`;
  const dueItems = priced.filter((i) => Number(i.due) > 0), dueMarked = dueItems.reduce((t, i) => t + Number(i.due), 0);
  const dueOther = Math.round(balance - dueMarked);
  const p = s.project;
  return `<section class="card">
      <h2>${esc(p.name)}</h2>
      <div class="muted">${[p.client_name, p.site].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="kpis num">
        <div><span>Total billed</span><b>${inr(total)}</b></div>
        <div><span>Paid so far</span><b class="in">${inr(received)}</b></div>
        <div><span>${balance >= 0 ? "Balance" : "Paid in advance"}</span><b>${inr(Math.abs(balance))}</b></div>
      </div>
    </section>
    ${balance > 0 && dueItems.length ? `<section class="card">
      <h2>What is due</h2>
      <div class="scroll"><table class="num"><thead><tr><th>Bill</th><th class="r">Billed</th><th class="r">Due</th></tr></thead><tbody>
        ${dueItems.map((i) => `<tr><td>${esc(i.item)}</td><td class="r">${inr(i.amount)}</td><td class="r" style="color:var(--out);font-weight:700">${inr(i.due)}</td></tr>`).join("")}
        ${dueOther > 0 ? `<tr><td>Balance on earlier bills</td><td class="r"></td><td class="r" style="color:var(--out);font-weight:700">${inr(dueOther)}</td></tr>` : ""}
        <tr class="sum"><td>Total due</td><td></td><td class="r">${inr(balance)}</td></tr>
      </tbody></table></div>
      <p class="note">Lines marked "Due" in the billing below are not yet paid. Please write to hello@indevastudio.com for payment details.</p>
    </section>` : ""}
    <section class="card">
      <h2>Billing</h2>
      <div class="scroll"><table class="num"><thead><tr><th>Work</th><th class="r">Amount</th></tr></thead><tbody>
        ${work.map(row).join("")}
        <tr class="sum"><td>Subtotal</td><td class="r">${inr(subtotal)}</td></tr>
        ${prov.length ? `<tr class="group"><td colspan="2"><b>${esc(prov[0].group_name || "Site overheads and wastage provision")}</b>
          <div class="muted" style="font-size:12px">Provision for site overheads, consumables and wastage</div></td></tr>
          ${prov.map(row).join("")}
          <tr class="sum"><td>Total provision</td><td class="r">${inr(provTotal)}</td></tr>` : ""}
        <tr class="sum"><td>Total</td><td class="r">${inr(total)}</td></tr>
        ${incl.length ? `<tr class="group"><td colspan="2"><b>Included — not added to the total</b>
          <div class="muted" style="font-size:12px">Shown for reference; these are not charged separately</div></td></tr>
          ${incl.map((i) => `<tr><td>${esc(i.item)}${qty(i)}</td><td class="r muted">${inr(i.amount)}</td></tr>`).join("")}` : ""}
      </tbody></table></div>
      ${pending.length ? `<p class="note"><b>To be priced (not included above):</b> ${pending.map((i) => `${esc(i.item)}${i.qty ? ` — ${Number(i.qty)} ${esc(i.unit || "")}` : ""}`).join("; ")}</p>` : ""}
    </section>
    <section class="card">
      <h2>Payments received</h2>
      ${receipts.length ? `<div class="scroll"><table class="num"><thead><tr><th>Date</th><th>Mode</th><th class="r">Amount</th></tr></thead><tbody>
        ${receipts.map((r) => `<tr><td>${fmtDate(r.date)}</td><td>${MODE[r.mode] || ""}</td><td class="r">${inr(r.amount)}</td></tr>`).join("")}
        <tr class="sum"><td colspan="2">Total received</td><td class="r">${inr(received)}</td></tr>
      </tbody></table></div>` : `<p class="note">No payments recorded yet.</p>`}
      <p class="note">Questions about this statement? Write to hello@indevastudio.com.</p>
    </section>`;
}
</script>
</body>
</html>
