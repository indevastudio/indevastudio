name: Fan-out publish

on:
  push:
    paths:
      - "feed.xml"

jobs:
  fan-out:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fan-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Publish to Medium
        run: node publish-medium.js
        continue-on-error: true
        env:
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}

      - name: Publish to Blogger
        run: node publish-blogger.js
        continue-on-error: true
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}

      - name: Publish to Tumblr
        run: node publish-tumblr.js
        continue-on-error: true
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}

      - name: Publish to WordPress.com
        run: node publish-wordpress.js
        continue-on-error: true
        env:
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
          WORDPRESS_SITE: ${{ secrets.WORDPRESS_SITE }}

      - name: Publish to Pinterest
        run: node publish-pinterest.js
        continue-on-error: true
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
